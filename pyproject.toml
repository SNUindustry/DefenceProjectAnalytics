[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defence-project-analytics"
version = "0.1.0"
description = "Read-only BigQuery analytics foundation for DefenceProject telemetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.120.2",
  "google-cloud-bigquery>=3.25",
  "db-dtypes>=1.3",
  "pandas>=2.2",
  "pyarrow>=17",
  "matplotlib>=3.9",
  "jupyter>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
defence-analytics = "defence_project_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
